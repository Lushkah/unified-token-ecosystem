[tool.poetry]
name = "unified-token-ecosystem"
version = "0.2.0"
description = "Unified Token AI Ecosystem - Merged intelligent agents and blockchain security platform"
authors = ["Lushkah <lushkah@github.com>"]
license = "MIT"
readme = "README.md"
python = "^3.10"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=html --cov-report=term"
